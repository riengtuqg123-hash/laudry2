services:
  - type: web
    name: giat-la-online
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: giat-la-data
          property: connectionString
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
databases:
  - name: giat-la-data
    region: singapore
    plan: free
